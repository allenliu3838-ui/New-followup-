<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>登录验证中 · 肾域·科研</title>
  <meta name="robots" content="noindex,nofollow"/>
  <meta name="referrer" content="no-referrer"/>
  <link rel="stylesheet" href="/lib/product-nav.css?v=registry-20261012-adoption-v4">
  <script src="/lib/product-nav.js?v=registry-20261012-adoption-v4" defer></script>
  <link rel="stylesheet" href="https://kidneysphere.com/shared/ks-brand.css">
  <link rel="stylesheet" href="/app.css?v=registry-20261012-adoption-v4"/>
  <link rel="icon" href="/assets/kidneysphere-ai.png"/>
  <style>
    .form-message { margin:12px 0 0; padding:10px 12px; border-radius:10px; background:#eef5fa; color:#24465c; overflow-wrap:anywhere; line-height:1.6; font-size:13px; }
    .form-message[hidden] { display:none; }
    .form-message[data-kind="error"] { background:#fff0f0; color:#9f2531; }
    .form-message[data-kind="warning"] { background:#fff6e6; color:#775000; }
    .form-message[data-kind="ok"] { background:rgba(22,163,74,.08); color:#14532d; }
    .form-message .btnbar { margin-top:8px; }
    #resendForm input { font-size:16px; }
  </style>
</head>
<body>
  <div class="container" style="max-width:480px">
    <!-- Loading state (default) -->
    <div class="card" id="callbackLoading" data-testid="auth-callback-loading">
      <div class="brand">
        <img src="/assets/kidneysphere-ai.png" alt="肾域·科研"/>
        <div>
          <h1 class="brand-title">登录验证中</h1>
          <div class="brand-sub">正在处理您的登录请求…</div>
        </div>
      </div>
      <div style="text-align:center;margin-top:20px">
        <div class="muted">请稍候，正在验证登录信息…</div>
      </div>
    </div>

    <!-- Success state -->
    <div class="card" id="callbackSuccess" data-testid="auth-callback-success" style="display:none">
      <div class="brand">
        <img src="/assets/kidneysphere-ai.png" alt="肾域·科研"/>
        <div>
          <h1 class="brand-title">登录成功</h1>
          <div class="brand-sub">即将跳转…</div>
        </div>
      </div>
      <div class="okbox" style="margin-top:12px" id="callbackSuccessMsg">
        登录成功，正在为您跳转…
      </div>
    </div>

    <!-- Error state: the new link can be requested right here -->
    <div class="card" id="callbackError" data-testid="auth-callback-error" style="display:none">
      <div class="brand">
        <img src="/assets/kidneysphere-ai.png" alt="肾域·科研"/>
        <div>
          <h1 class="brand-title" id="callbackErrorTitle">登录链接未能使用</h1>
          <div class="brand-sub">可以在本页直接重新发送</div>
        </div>
      </div>
      <div class="warnbox" style="margin-top:12px">
        <div id="callbackErrorMsg" data-testid="auth-callback-error-msg">登录链接无效或已过期。</div>
      </div>
      <form id="resendForm" novalidate style="margin-top:6px">
        <label for="resendEmail">注册邮箱</label>
        <input id="resendEmail" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="name@example.com"/>
        <div class="btnbar" style="margin-top:12px">
          <button class="btn primary" type="submit" id="callbackResendBtn" data-testid="auth-callback-resend">重新发送登录链接</button>
          <a class="btn" href="/login" id="callbackPasswordLogin">用密码登录</a>
        </div>
      </form>
      <div id="resendHint" class="form-message" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      <div class="muted small" style="margin-top:12px">
        还没有账号？<a href="/signup">注册</a> · <a href="/">返回首页</a> · 需要帮助请联系 <a href="mailto:china@kidneysphere.com">china@kidneysphere.com</a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div>微信：GlomConChina1 · 邮箱：<a href="mailto:china@kidneysphere.com">china@kidneysphere.com</a></div>
    <div style="margin-top:4px">© 2025–2026 上海胤域医学科技有限公司 · 肾域·科研 · <a href="/security">安全合规</a> · <a href="/privacy">隐私政策</a> · <a href="/terms">用户协议</a> · <a href="/disclaimer">免责声明</a> · <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">沪ICP备2026008040号-1</a> · <a href="https://beian.mps.gov.cn/#/query/webSearch?code=37091102000922" target="_blank" rel="noopener">鲁公网安备37091102000922号</a></div>
  </footer>

  <script src="/lib/error-logger.js?v=registry-20261012-adoption-v4"></script>
  <script src="/config.js?v=registry-20261012-adoption-v4"></script>
  <script type="module">
    const V = "?v=registry-20261012-adoption-v4";
    const $ = (id) => document.getElementById(id);
    const elLoading = $("callbackLoading");
    const elSuccess = $("callbackSuccess");
    const elError = $("callbackError");

    // Read everything from the URL once, then remove credentials from the address bar.
    const params = new URLSearchParams(location.search);
    const hashParams = new URLSearchParams(location.hash.replace(/^#/, ""));
    const isRecovery = params.get("recovery") === "1" || hashParams.get("type") === "recovery";
    let storedReturnTo = null;
    try { storedReturnTo = sessionStorage.getItem("auth_returnTo"); sessionStorage.removeItem("auth_returnTo"); } catch (_) {}
    const cleanUrl = () => { try { history.replaceState(null, "", location.pathname); } catch (_) {} };

    let sb = null;
    let lib = null;
    let returnTo = "/staff";
    let rlResend = null;
    let sending = false;

    function withDeadline(promise, milliseconds, label) {
      let timer;
      return Promise.race([
        promise,
        new Promise((_, reject) => { timer = setTimeout(() => reject(Object.assign(new Error(label), { code: "request_timeout" })), milliseconds); }),
      ]).finally(() => clearTimeout(timer));
    }

    function hint(text, kind = "info", actions = []) {
      const node = $("resendHint");
      node.textContent = "";
      node.dataset.kind = kind;
      node.hidden = !text;
      if (!text) return;
      const line = document.createElement("div");
      line.textContent = text;
      node.appendChild(line);
      if (actions.length) {
        const bar = document.createElement("div");
        bar.className = "btnbar";
        for (const action of actions) {
          const link = document.createElement("a");
          link.href = action.href;
          link.className = "btn small" + (action.primary ? " primary" : "");
          link.textContent = action.label;
          bar.appendChild(link);
        }
        node.appendChild(bar);
      }
    }

    function showSuccess(text) {
      elLoading.style.display = "none";
      elError.style.display = "none";
      elSuccess.style.display = "block";
      if (text) $("callbackSuccessMsg").textContent = text;
    }

    function showError(text, kind = "unknown") {
      elLoading.style.display = "none";
      elSuccess.style.display = "none";
      elError.style.display = "block";
      let shown = text || "登录链接无效或已过期。";
      if (isRecovery) shown = shown.replace(/重新发送登录链接/g, "重新发送重设密码邮件").replace(/登录链接/g, "重设密码链接");
      $("callbackErrorMsg").textContent = shown;
      if (isRecovery) {
        $("callbackErrorTitle").textContent = "重设密码链接未能使用";
        $("callbackResendBtn").textContent = "重新发送重设密码邮件";
      }
      $("resendEmail").focus();
      if (window.ErrorLogger) window.ErrorLogger.log("auth.callback.error", kind);
    }

    function errorText(error) {
      if (!lib) return "登录验证没有完成，请重新发送登录链接，或到登录页用密码登录。";
      const kind = lib.authErrorKind(error);
      if (kind === "unknown" || kind === "server") return "登录验证没有完成：" + lib.authErrorMessage(error) + " 也可以在下方重新发送登录链接。";
      return lib.authErrorMessage(error);
    }

    // ── Resend directly from the failure page (no dead end) ──
    $("resendForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (sending) return;
      if (!sb || !lib) { hint("登录服务未能连接，请刷新页面后重试，或到登录页操作。", "error", [{ label: "去登录页", href: "/login?mode=link", primary: true }]); return; }
      const input = $("resendEmail");
      const email = input.value.trim().toLowerCase();
      input.value = email;
      if (!email || !input.validity.valid) { hint("请输入有效的邮箱地址。", "error"); input.focus(); return; }
      if (!rlResend.allow()) { hint(rlResend.message, "error"); return; }
      const button = $("callbackResendBtn");
      const label = button.textContent;
      sending = true;
      button.disabled = true;
      button.textContent = "正在发送…";
      hint("正在发送…");
      try {
        if (isRecovery) {
          const { error } = await withDeadline(sb.auth.resetPasswordForEmail(email, {
            redirectTo: lib.authCallbackUrl(location.origin, "/staff", { recovery: true }),
          }), 30000, "RESET_TIMEOUT");
          if (error) throw error;
          hint(`如果 ${email} 已注册，新的重设密码邮件已经发出。请打开最新一封邮件中的链接。`, "ok");
        } else {
          const { error } = await withDeadline(sb.auth.signInWithOtp({
            email, options: { shouldCreateUser: false, emailRedirectTo: lib.authCallbackUrl(location.origin, returnTo) },
          }), 30000, "OTP_TIMEOUT");
          if (error) throw error;
          hint(`新的登录链接已发送到 ${email}。请打开最新一封邮件中的链接；每个链接只能使用一次。没有收到请检查垃圾邮件。`, "ok");
        }
      } catch (error) {
        if (lib.authErrorKind(error) === "not_registered") {
          hint(lib.authErrorMessage(error), "warning", [{ label: "去注册", href: "/signup", primary: true }]);
        } else {
          hint("未能发送：" + lib.authErrorMessage(error), "error", [{ label: "用密码登录", href: "/login" }]);
        }
      } finally {
        sending = false;
        button.disabled = false;
        button.textContent = label;
      }
    });

    async function handleCallback() {
      const [clientModule, rateModule, authModule] = await withDeadline(Promise.all([
        import("/lib/supabase-client.js" + V),
        import("/lib/rate-limit.js" + V),
        import("/lib/auth-navigation.js" + V),
      ]), 15000, "INIT_TIMEOUT");
      lib = { ...rateModule, ...authModule };
      returnTo = lib.safeReturnTo(params.get("returnTo") || storedReturnTo);
      rlResend = lib.throttle("callbackResend", { maxAttempts: 5, windowMs: 15 * 60_000, message: "发送请求过于频繁" });
      sb = clientModule.supabase({ detectSessionInUrl: false });
      const destination = isRecovery ? "/login?recovery=1" : returnTo;

      // Explicit error returned by the auth service (expired / used / invalid link)
      const errorCode = hashParams.get("error_code") || params.get("error_code") || hashParams.get("error") || params.get("error");
      if (errorCode) {
        const description = (hashParams.get("error_description") || params.get("error_description") || "").replace(/\+/g, " ");
        cleanUrl();
        showError(errorText({ code: errorCode, message: description }), errorCode);
        return;
      }

      // PKCE code in query params
      const code = params.get("code");
      if (code) {
        cleanUrl();
        try {
          const { data, error } = await sb.auth.exchangeCodeForSession(code);
          if (error) throw error;
          if (!data?.session) throw Object.assign(new Error("no session"), { code: "session_not_found" });
          showSuccess(isRecovery ? "验证成功，正在进入设置新密码…" : undefined);
          setTimeout(() => location.replace(destination), 800);
        } catch (error) {
          showError(errorText(error), lib.authErrorKind(error));
        }
        return;
      }

      // Implicit-flow tokens in the hash
      if (hashParams.get("access_token") || hashParams.get("refresh_token")) {
        const access_token = hashParams.get("access_token");
        const refresh_token = hashParams.get("refresh_token");
        cleanUrl();
        try {
          if (!access_token || !refresh_token) throw Object.assign(new Error("incomplete"), { code: "incomplete_link" });
          const { data, error } = await sb.auth.setSession({ access_token, refresh_token });
          if (error || !data?.session) throw error || Object.assign(new Error("no session"), { code: "session_not_found" });
          showSuccess(isRecovery ? "验证成功，正在进入设置新密码…" : undefined);
          setTimeout(() => location.replace(destination), 600);
        } catch (error) {
          showError(error?.code === "incomplete_link"
            ? "登录链接不完整，可能被邮件软件截断。请在下方重新发送登录链接，并点击邮件中的按钮打开。"
            : errorText(error), error?.code || "set_session");
        }
        return;
      }

      // No credentials in the URL — maybe already signed in
      cleanUrl();
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        showSuccess();
        setTimeout(() => location.replace(destination), 600);
        return;
      }
      showError("没有在链接中找到登录信息：链接可能不完整、已经使用过或已过期。请在下方重新发送登录链接。", "no_credentials");
    }

    handleCallback().catch((error) => {
      cleanUrl();
      if (!sb) {
        showError("登录服务未能连接，请检查网络后重新打开邮件中的链接；也可以到登录页重试。", "init");
        $("callbackResendBtn").disabled = true;
        hint("当前无法发送新链接。", "warning", [{ label: "去登录页", href: "/login?mode=link", primary: true }, { label: "刷新页面", href: location.pathname }]);
        return;
      }
      showError("登录验证暂时没有完成，请检查网络后重新打开验证链接，或在下方重新发送登录链接。", lib?.authErrorKind(error) || "unknown");
    });
  </script>
</body>
</html>
