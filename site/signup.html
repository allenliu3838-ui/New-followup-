<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>注册 · 肾域·科研</title>
  <meta name="robots" content="noindex,nofollow"/>
  <meta name="referrer" content="no-referrer"/>
  <link rel="stylesheet" href="https://kidneysphere.com/shared/ks-topbar.css">
  <link rel="stylesheet" href="https://kidneysphere.com/shared/ks-brand.css">
  <link rel="stylesheet" href="/app.css?v=registry-20260914-integrated-v1"/>
  <link rel="icon" href="/assets/kidneysphere-ai.png"/>
  <style>
    .onboarding-steps { display:flex; gap:0; margin:16px 0 12px; }
    .ob-step { flex:1; text-align:center; padding:8px 4px; font-size:12px; color:var(--muted); border-bottom:3px solid var(--border); }
    .ob-step.active { color:var(--brand); border-bottom-color:var(--brand); font-weight:700; }
    .ob-step.done { color:var(--ok); border-bottom-color:var(--ok); }
    .ob-panel { display:none; }
    .ob-panel.active { display:block; }
  </style>
</head>
<body>
  <div class="container" style="max-width:520px">
    <!-- Step 0: Registration -->
    <div class="card" id="registerCard">
      <div class="brand">
        <img src="/assets/kidneysphere-ai.png" alt="肾域·科研"/>
        <div>
          <h1 class="brand-title">注册账号</h1>
          <div class="brand-sub">30 天免费试用，核心功能可用</div>
        </div>
      </div>

      <label>邮箱</label>
      <input id="email" type="email" placeholder="name@example.com"/>
      <label>密码（至少 8 位）</label>
      <input id="password" type="password" placeholder="请设置密码"/>
      <label>确认密码</label>
      <input id="confirmPwd" type="password" placeholder="再次输入密码"/>

      <div id="consentBox" style="margin-top:12px">
        <label style="display:flex;align-items:flex-start;gap:6px;cursor:pointer;margin:0">
          <input type="checkbox" id="agreeTerms" style="width:auto;margin-top:2px"/>
          <span class="small">我已阅读并同意 <a href="/terms" target="_blank">用户协议</a> 和 <a href="/privacy" target="_blank">隐私政策</a></span>
        </label>
      </div>

      <div class="btnbar">
        <button class="btn primary" id="btnRegister">注册并开始试用</button>
      </div>
      <div id="registerHint" class="muted small" style="margin-top:8px"></div>
      <div class="muted small" style="margin-top:12px">
        已有账号？<a href="/login">直接登录</a>
      </div>
    </div>

    <!-- Onboarding container (content injected from template after auth) -->
    <div id="onboardingCard" class="card" style="display:none"></div>

    <template id="onboardingTpl">
      <h2 style="margin:0 0 4px">快速上手</h2>
      <div class="muted small">完成以下 3 步，即可开始使用。</div>

      <div class="onboarding-steps">
        <div class="ob-step active" id="obDot1">1. 研究者资料</div>
        <div class="ob-step" id="obDot2">2. 创建项目</div>
        <div class="ob-step" id="obDot3">3. 录入首例患者</div>
      </div>

      <!-- Onboarding Step 1: Profile -->
      <div class="ob-panel active" id="obStep1">
        <label>姓名</label>
        <input id="obName" placeholder="例如：张三"/>
        <label>医院 / 单位</label>
        <input id="obHospital" placeholder="例如：北京协和医院"/>
        <label>科室</label>
        <input id="obDept" placeholder="例如：肾内科"/>
        <div class="btnbar">
          <button class="btn primary" id="btnObStep1">下一步</button>
          <button class="btn" id="btnObSkip1">稍后再填</button>
        </div>
      </div>

      <!-- Onboarding Step 2: Create Project -->
      <div class="ob-panel" id="obStep2">
        <label>项目名称</label>
        <input id="obProjName" placeholder="例如：IgA肾病随访（BJ01）"/>
        <label>中心代码</label>
        <input id="obProjCenter" placeholder="例如：BJ01"/>
        <label>病种模块</label>
        <select id="obProjModule">
          <option value="IGAN">IgAN（IgA 肾病）</option>
          <option value="LN">LN（狼疮性肾炎）</option>
          <option value="MN">MN（膜性肾病）</option>
          <option value="GENERAL">通用（混合/其他）</option>
          <option value="KTX">KTx（肾移植术后）</option>
        </select>
        <div class="btnbar">
          <button class="btn primary" id="btnObStep2">创建并下一步</button>
          <button class="btn" id="btnObSkip2">稍后再做</button>
        </div>
      </div>

      <!-- Onboarding Step 3: First Patient -->
      <div class="ob-panel" id="obStep3">
        <label>研究编号</label>
        <input id="obPatCode" placeholder="例如：0001"/>
        <div class="row">
          <div class="col">
            <label>性别</label>
            <select id="obPatSex">
              <option value="">未填</option>
              <option value="M">男</option>
              <option value="F">女</option>
            </select>
          </div>
          <div class="col">
            <label>出生年份</label>
            <input id="obPatBirthYear" type="number" placeholder="例如：1985"/>
          </div>
        </div>
        <div class="btnbar">
          <button class="btn primary" id="btnObStep3">录入并完成</button>
          <button class="btn" id="btnObSkip3">稍后录入</button>
        </div>
      </div>

      <!-- Onboarding Done -->
      <div class="ob-panel" id="obDone">
        <div class="okbox" style="margin-top:10px">
          设置已完成。实际可用项目数和到期时间以工作台显示为准。
        </div>
        <div class="btnbar">
          <a class="btn primary" href="/staff">进入工作台</a>
        </div>
      </div>
    </template>
  </div>

  <footer class="site-footer">
    <div>微信：GlomConChina1 · 邮箱：<a href="mailto:china@kidneysphere.com">china@kidneysphere.com</a></div>
    <div style="margin-top:4px">© 2025–2026 上海胤域医学科技有限公司 · 肾域·科研 · <a href="/security">安全合规</a> · <a href="/privacy">隐私政策</a> · <a href="/terms">用户协议</a> · <a href="/disclaimer">免责声明</a> · <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">沪ICP备2026008040号-1</a> · <a href="https://beian.mps.gov.cn/#/query/webSearch?code=37091102000922" target="_blank" rel="noopener">鲁公网安备37091102000922号</a></div>
  </footer>

  <script src="/lib/error-logger.js?v=registry-20260914-integrated-v1"></script>
  <script src="/config.js?v=registry-20260914-integrated-v1"></script>
  <script type="module">
    import { supabase } from "/lib/supabase-client.js?v=registry-20260914-integrated-v1";
    import { qs, toast } from "/lib/utils.js?v=registry-20260914-integrated-v1";
    import { throttle } from "/lib/rate-limit.js?v=registry-20260914-integrated-v1";
    import { validatePassword } from "/lib/password-strength.js?v=registry-20260914-integrated-v1";
    const sb = supabase();
    const rlRegister = throttle("register", { maxAttempts: 5, windowMs: 15 * 60_000, message: "注册请求过于频繁" });
    let createdProjectId = null;
    let onboardingBound = false;
    let consentSaved = false;

    async function rpc(name, params) {
      const { data, error } = await sb.rpc(name, params);
      if (error) {
        const messages={project_quota_exceeded:'项目数量已达到当前配额，请进入工作台查看已有项目或联系平台调整',subscription_required:'账户试用已结束，请联系平台开通后创建项目',authentication_required:'登录状态已失效，请重新登录'};
        throw new Error(messages[error.message] || error.message || '请求失败，请重试');
      }
      return data;
    }
    async function saveConsent() {
      if (consentSaved) return;
      if (!qs('#onboardingConsent')?.checked) throw new Error('请确认用户协议和隐私政策后继续');
      await rpc('log_consent', { p_action: 'register', p_policy_type: 'both', p_policy_version: 'v2.0', p_user_agent: navigator.userAgent });
      consentSaved = true;
    }
    function showOnboarding() {
      const card = qs('#onboardingCard');
      if (!card.children.length) {
        card.appendChild(qs('#onboardingTpl').content.cloneNode(true));
        const consent = document.createElement('div');
        consent.className = 'warnbox small';
        consent.innerHTML = '<label><input type="checkbox" id="onboardingConsent"/> 我确认已阅读并同意 <a href="/terms" target="_blank" rel="noopener">用户协议</a> 和 <a href="/privacy" target="_blank" rel="noopener">隐私政策</a>。请先用模拟数据熟悉流程。</label>';
        card.prepend(consent);
        qs('#onboardingConsent').checked = !!qs('#agreeTerms')?.checked;
      }
      qs('#registerCard').style.display = 'none';
      card.style.display = 'block';
      if (!onboardingBound) { onboardingBound = true; bindOnboarding(); }
    }
    function goStep(n) {
      ['obStep1','obStep2','obStep3','obDone'].forEach((id,i) => qs('#'+id).classList.toggle('active', i===n-1));
      [1,2,3].forEach(i => { const dot=qs('#obDot'+i); dot.className=i<n?'ob-step done':i===n?'ob-step active':'ob-step'; });
    }
    function bind(id, fn) {
      qs(id).addEventListener('click', async () => {
        const btn=qs(id); if(btn.disabled) return; btn.disabled=true;
        try { await saveConsent(); await fn(); } catch(e) { toast(e?.message || '操作失败，请重试'); }
        finally { btn.disabled=false; }
      });
    }
    function bindOnboarding() {
      bind('#btnObStep1', async () => {
        await rpc('upsert_my_profile', {p_real_name:qs('#obName').value.trim()||null,p_hospital:qs('#obHospital').value.trim()||null,p_department:qs('#obDept').value.trim()||null,p_interested_plan:'trial',p_contact:null,p_notes:null});
        goStep(2);
      });
      bind('#btnObSkip1', async()=>goStep(2));
      bind('#btnObStep2', async()=>{
        const name=qs('#obProjName').value.trim(), center=qs('#obProjCenter').value.trim();
        if(!name || !center) throw new Error('请填写项目名称和中心代码');
        createdProjectId=await rpc('create_project',{p_name:name,p_center_code:center,p_module:qs('#obProjModule').value,p_description:null});
        if(!createdProjectId) throw new Error('未收到项目创建结果，请刷新工作台核对后再试');
        toast('项目已创建');goStep(3);
      });
      bind('#btnObSkip2',async()=>goStep(4));
      bind('#btnObStep3',async()=>{
        if(!createdProjectId) throw new Error('请先创建项目');
        const code=qs('#obPatCode').value.trim();if(!code) throw new Error('请填写研究编号');
        const rawYear=qs('#obPatBirthYear').value.trim();
        const year=rawYear===''?null:Number(rawYear);
        if(year!==null && (!Number.isInteger(year)||year<1900||year>new Date().getFullYear())) throw new Error('出生年份无效');
        const {error}=await sb.from('patients_baseline').insert({project_id:createdProjectId,patient_code:code,sex:qs('#obPatSex').value||null,birth_year:year,baseline_date:null,baseline_scr:null,baseline_upcr:null});
        if(error) throw error;toast('患者已录入，进入工作台补充基线');goStep(4);
      });
      bind('#btnObSkip3',async()=>goStep(4));
    }
    qs('#btnRegister').addEventListener('click',async()=>{
      if(!rlRegister.allow()) return toast(rlRegister.message);
      const email=qs('#email').value.trim().toLowerCase(),password=qs('#password').value;
      if(!email || !qs('#email').checkValidity()) return toast('请输入有效邮箱');
      const check=validatePassword(password);if(!check.valid) return toast(check.message);
      if(password!==qs('#confirmPwd').value) return toast('两次密码不一致');
      if(!qs('#agreeTerms').checked) return toast('请先阅读并同意用户协议和隐私政策');
      const btn=qs('#btnRegister');btn.disabled=true;
      try {
        const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/auth-callback?returnTo=/signup'}});
        if(error) throw error;
        qs('#password').value='';qs('#confirmPwd').value='';
        if(data?.user?.identities?.length===0) { qs('#registerHint').textContent='该邮箱已注册，请直接登录。';return; }
        if(data?.session) showOnboarding();
        else qs('#registerHint').textContent='注册申请已提交。请打开邮箱中的确认链接；确认后登录并完成资料设置。未收到时请检查垃圾邮件或联系支持。';
      } catch(e) { toast('注册失败：'+(e?.message||'请重试')); }
      finally { btn.disabled=false; }
    });
    sb.auth.onAuthStateChange((event,s)=>{if(s && event==='SIGNED_IN') showOnboarding();});
    const {data:{session},error}=await sb.auth.getSession();
    if(error) qs('#registerHint').textContent='无法读取登录状态，请刷新重试';
    else if(session) showOnboarding();
  </script>
</body>
</html>
