# 未知路径返回 404，不要再回落到首页（首页兜底会让 /audit 等地址以 HTTP 200 打开首页）。
# 放在 kidneysphereregistry.cn 的 443 server 块中，位于已有的精确路由（/staff、/followup、/guide 等）之后。
# 已有的精确路由继续用各自的 location；下面只处理“没有对应文件、也没有精确路由”的地址。
#
# 若当前配置是 try_files $uri $uri/ /index.html; 或 error_page 404 /index.html;
# 请改成：
#
#   error_page 404 /404.html;
#   location / {
#       try_files $uri $uri/ $uri.html =404;
#   }
#
# /404.html 使用仓库里的 site/404.html（发布后在网站根目录）。
# 不要为 /audit 单独做页面：修改记录在登录后的工作台“修改记录”一节，不提供公开地址。
#
# 核对（应看到 404，正文含“页面未找到”，而不是首页标题）：
#   curl -sI https://kidneysphereregistry.cn/audit | head -n 1
#   curl -s https://kidneysphereregistry.cn/audit | head
