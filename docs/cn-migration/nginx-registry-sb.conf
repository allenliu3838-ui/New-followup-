# 放在 /etc/nginx/conf.d/kidneysphereregistry.conf 的 443 server 块内（维护窗口中、发布捕获之前加入）。
# ^~ 必须保留：否则按扩展名匹配的静态资源规则（.jpg/.js 等）会截走 /sb/ 下的请求。
location ^~ /sb/ {
    proxy_pass http://172.24.34.36:8000/;          # 新 ECS 内网地址；末尾斜杠去掉 /sb 前缀
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /sb;
    client_max_body_size 12m;                       # 付款凭证上限 10MB
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
}

# 同一 server 块的 Content-Security-Policy 改为（去掉 *.supabase.co、plausible.io、cdn.jsdelivr.net）：
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://kidneysphere.com; style-src 'self' 'unsafe-inline' https://kidneysphere.com; img-src 'self' data: https://kidneysphere.com; connect-src 'self'; font-src 'self' https://kidneysphere.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# 同一 server 块、紧接 CSP 之后再加一行（2026-10-17 切换后补加）：/staff、/login 等精确路由页面原先没有缓存头，
# 浏览器会沿用切换前的旧 HTML，与新版 JS 不匹配导致登录后停在登录页。
